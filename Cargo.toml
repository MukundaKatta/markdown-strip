[package]
name = "markdown-strip"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"  # MSRV
description = "Strip Markdown formatting (headers, bold, italic, links, code, blockquotes) to plain text. Conservative, fast, zero deps."
authors = ["Mukunda Rao Katta <mukunda.vjcs6@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MukundaKatta/markdown-strip"
homepage = "https://github.com/MukundaKatta/markdown-strip"
documentation = "https://docs.rs/markdown-strip"
readme = "README.md"
keywords = ["markdown", "strip", "plain-text", "llm", "sanitize"]
categories = ["text-processing"]
exclude = [".github/*", "target/*"]
autobins = false

# The md2txt binary (built by default). The library itself stays zero-dep:
# dependents get a dependency-free build with `default-features = false`.
[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "md2txt"
path = "src/bin/md2txt.rs"
required-features = ["cli"]

# CLI tests spawn the binary, so they only build when the binary does.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
